version: 2
entries:
  - surface: github-actions
    uses: actions/checkout
    reason: Fetches the repository.
  - surface: github-actions
    uses: actions/setup-go
    reason: Installs the Go toolchain.
  - surface: github-actions
    uses: actions/upload-artifact
    reason: Uploads the gate records.
  - surface: github-actions
    run: |
      version="$(tr -d '\r\n' < .dinyd-version)"
      curl -fsSL "https://github.com/undervoke/dinyd/releases/download/v${version#v}/dinyd-installer.sh" -o "$RUNNER_TEMP/dinyd-installer.sh"
      cd "$RUNNER_TEMP"
      sh dinyd-installer.sh
    reason: Installs the pinned DinyD runtime with its official installer.
  - surface: github-actions
    run: test -z "$(gofmt -l .)"
    reason: Formatting is judged by gofmt.
  - surface: github-actions
    run: go vet ./...
    reason: Static analysis is judged by go vet.
  - surface: github-actions
    run: |
      set -euo pipefail
      mkdir -p dist
      for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
        os="${target%/*}"
        arch="${target#*/}"
        name="ytif_${GITHUB_REF_NAME}_${os}_${arch}"
        CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/ytif" ./cmd/ytif
        cp LICENSE README.md "dist/$name/"
        tar -C dist -czf "dist/$name.tar.gz" "$name"
      done
      (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
    reason: Packages the release archives.
  - surface: github-actions
    run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
    reason: Publishes the release.
