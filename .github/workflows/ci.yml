name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ytif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: checks
        run: go run ./cmd/ytif ci --report github --records ytif-records.jsonl
      - name: records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ytif-records
          path: ytif-records.jsonl
